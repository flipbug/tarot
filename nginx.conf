server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Clean URLs: adapter-static emits flat <route>.html files
    # (e.g. /library -> library.html, /card/the-fool -> card/the-fool.html).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed, immutable app bundles
    location /_app/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Self-hosted fonts — immutable
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Card art — long-lived but allow occasional refresh
    location /cards/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
