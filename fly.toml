# fly.toml — The Tarot
# Prerendered SvelteKit (adapter-static) served by nginx.
# See https://fly.io/docs/reference/configuration/

app = 'the-tarot'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

[[vm]]
  memory = '256mb'
  cpus = 1
